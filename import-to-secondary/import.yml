---
# Import AAP Controller configuration to Secondary node
# Uses infra.aap_configuration_extended.filetree_read + infra.aap_configuration.dispatch (AAP 2.5+)
#
# Usage:
#   ansible-playbook import-to-secondary/import.yml -e @group_vars/all.yml
#
- name: Import configuration to Secondary AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_hostname: "{{ secondary_aap_hostname }}"
    aap_username: "{{ secondary_aap_username }}"
    aap_password: "{{ secondary_aap_password }}"
    aap_oauthtoken: "{{ secondary_aap_oauthtoken | default(omit) }}"
    aap_validate_certs: "{{ secondary_aap_validate_certs }}"

    # filetree_read requires orgs/dir_orgs_vars, but we override all paths
    # to point at the flat export directory produced by filetree_create
    orgs: "unused"
    dir_orgs_vars: "{{ playbook_dir }}/../config-data/primary"

    # Override every filetree path to the export root so recurse:true finds all files
    filetree_controller_settings: "{{ dir_orgs_vars }}/"
    filetree_aap_organizations: "{{ dir_orgs_vars }}/"
    filetree_controller_labels: "{{ dir_orgs_vars }}/"
    filetree_aap_user_accounts: "{{ dir_orgs_vars }}/"
    filetree_aap_teams: "{{ dir_orgs_vars }}/"
    filetree_controller_credential_types: "{{ dir_orgs_vars }}/"
    filetree_controller_credentials: "{{ dir_orgs_vars }}/"
    filetree_controller_credential_input_sources: "{{ dir_orgs_vars }}/"
    filetree_controller_notifications: "{{ dir_orgs_vars }}/"
    filetree_controller_projects: "{{ dir_orgs_vars }}/"
    filetree_controller_execution_environments: "{{ dir_orgs_vars }}/"
    filetree_aap_applications: "{{ dir_orgs_vars }}/"
    filetree_controller_inventories: "{{ dir_orgs_vars }}/"
    filetree_controller_inventory_sources: "{{ dir_orgs_vars }}/"
    filetree_controller_instance_groups: "{{ dir_orgs_vars }}/"
    filetree_controller_hosts: "{{ dir_orgs_vars }}/"
    filetree_controller_groups: "{{ dir_orgs_vars }}/"
    filetree_controller_templates: "{{ dir_orgs_vars }}/"
    filetree_controller_workflow_job_templates: "{{ dir_orgs_vars }}/"
    filetree_controller_schedules: "{{ dir_orgs_vars }}/"
    filetree_controller_roles: "{{ dir_orgs_vars }}/"

  pre_tasks:
    - name: Find vault placeholder variables in export data
      ansible.builtin.shell: >
        grep -roh 'vaulted_[a-zA-Z0-9_]*' {{ dir_orgs_vars }}/ 2>/dev/null | sort -u
      register: vault_placeholders
      changed_when: false
      failed_when: false

    - name: Define dummy vault variables to prevent template errors
      ansible.builtin.set_fact:
        "{{ item }}": ""
      loop: "{{ vault_placeholders.stdout_lines | default([]) }}"
      when: vault_placeholders.stdout_lines | default([]) | length > 0

    - name: Temporarily move ORGANIZATIONLESS directory out of import scope
      ansible.builtin.command:
        cmd: "mv {{ dir_orgs_vars }}/ORGANIZATIONLESS {{ dir_orgs_vars }}/../.ORGANIZATIONLESS.bak"
        removes: "{{ dir_orgs_vars }}/ORGANIZATIONLESS"

    - name: Fix empty simplified_workflow_nodes fields
      ansible.builtin.shell: >
        find {{ dir_orgs_vars }}/ -name '*.yaml' -o -name '*.yml' |
        xargs grep -l 'simplified_workflow_nodes:$' 2>/dev/null |
        xargs -r sed -i 's/simplified_workflow_nodes:$/simplified_workflow_nodes: []/'
      changed_when: false
      failed_when: false

    - name: Check export data exists
      ansible.builtin.stat:
        path: "{{ dir_orgs_vars }}"
      register: export_dir

    - name: Fail if no export data
      ansible.builtin.fail:
        msg: >
          Export data not found at {{ dir_orgs_vars }}.
          Run export-from-primary/export.yml first.
      when: not export_dir.stat.exists

    - name: Show export metadata
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../config-data/export_metadata.yml"
        name: export_meta
      ignore_errors: true

    - name: Report source info
      ansible.builtin.debug:
        msg: "Importing from: {{ export_meta | default('metadata not found') }}"

  roles:
    - role: infra.aap_configuration_extended.filetree_read
    - role: infra.aap_configuration.dispatch

  post_tasks:
    - name: Restore ORGANIZATIONLESS directory
      ansible.builtin.command:
        cmd: "mv {{ dir_orgs_vars }}/../.ORGANIZATIONLESS.bak {{ dir_orgs_vars }}/ORGANIZATIONLESS"
        removes: "{{ dir_orgs_vars }}/../.ORGANIZATIONLESS.bak"

    - name: Record import timestamp
      ansible.builtin.copy:
        content: |
          import_target: "{{ aap_hostname }}"
          import_time: "{{ now(utc=true) | string }}"
          import_user: "{{ aap_username }}"
        dest: "{{ playbook_dir }}/../config-data/import_metadata.yml"
        mode: "0644"

    - name: Import complete
      ansible.builtin.debug:
        msg: "Configuration imported to {{ aap_hostname }} successfully."
