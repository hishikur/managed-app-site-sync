---
# Export AAP Controller configuration from Primary node
# Uses infra.aap_configuration_extended.filetree_create (AAP 2.5+)
#
# Usage:
#   ansible-playbook export-from-primary/export.yml -e @group_vars/all.yml
#
- name: Rotate previous exports
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    export_dir: "{{ playbook_dir }}/../config-data/primary"
    export_keep_generations: 3

  tasks:
    - name: Remove oldest generation (primary.{{ export_keep_generations }})
      ansible.builtin.file:
        path: "{{ export_dir }}.{{ export_keep_generations }}"
        state: absent

    - name: Rotate previous generations
      ansible.builtin.command:
        cmd: "mv {{ export_dir }}.{{ item - 1 }} {{ export_dir }}.{{ item }}"
        removes: "{{ export_dir }}.{{ item - 1 }}"
      loop: "{{ range(export_keep_generations, 1, -1) | list }}"

    - name: Save current as primary.1
      ansible.builtin.command:
        cmd: "mv {{ export_dir }} {{ export_dir }}.1"
        removes: "{{ export_dir }}"

- name: Export configuration from Primary AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_hostname: "{{ primary_aap_hostname }}"
    aap_username: "{{ primary_aap_username }}"
    aap_password: "{{ primary_aap_password }}"
    aap_oauthtoken: "{{ primary_aap_oauthtoken | default(omit) }}"
    aap_validate_certs: "{{ primary_aap_validate_certs }}"
    output_path: "{{ playbook_dir }}/../config-data/primary"

  pre_tasks:
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_path }}"
        state: directory
        mode: "0755"

    - name: Record export timestamp
      ansible.builtin.copy:
        content: |
          export_source: "{{ aap_hostname }}"
          export_time: "{{ now(utc=true) | string }}"
          export_user: "{{ aap_username }}"
        dest: "{{ output_path }}/../export_metadata.yml"
        mode: "0644"

  roles:
    - role: infra.aap_configuration_extended.filetree_create
      vars:
        input_tag:
          - controller_inventories
          - controller_credentials
          - controller_credential_types
          - controller_notification_templates
          - controller_teams
          - controller_organizations
          - controller_job_templates
          - controller_projects
          - controller_execution_environments
          - controller_workflow_job_templates
          - controller_settings
          - controller_instance_groups
          - controller_labels
          - controller_schedules

  post_tasks:
    - name: Show exported files summary
      ansible.builtin.find:
        paths: "{{ output_path }}"
        recurse: true
        file_type: file
      register: exported_files

    - name: Report
      ansible.builtin.debug:
        msg: "Exported {{ exported_files.matched }} files to {{ output_path }}"
